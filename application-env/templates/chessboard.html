<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='chessboard.css') }}?v=10">
    <script src="{{ url_for('static', filename='chessboard.js') }}"></script>
</head>

<body class="bg-dark">

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-white mb-0">Chess Board</h1>
            <a href="/" class="btn btn-success">← Back to Home</a>
        </div>

        <div class="card shadow-lg mx-auto" style="max-width: 720px;">
            <div class="card-body d-flex justify-content-center">
                <table id="ChessTable">
                    <tr><th class="axis">8</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><th class="axis">7</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><th class="axis">6</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><th class="axis">5</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><th class="axis">4</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><th class="axis">3</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><th class="axis">2</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><th class="axis">1</th><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>

                    <tr>
                        <th class="axis"></th>
                        <th class="axis">a</th>
                        <th class="axis">b</th>
                        <th class="axis">c</th>
                        <th class="axis">d</th>
                        <th class="axis">e</th>
                        <th class="axis">f</th>
                        <th class="axis">g</th>
                        <th class="axis">h</th>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
