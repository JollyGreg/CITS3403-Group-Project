<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master - Play</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chessboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chatbox.css') }}">
    <script src="{{ url_for('static', filename='js/chessboard.js') }}"></script>
</head>
<body>

    <nav>
        <div class="logo">
            <span style="color: var(--text-main);">Chess</span> Master
        </div>
        <div class="nav-buttons">
            <button onclick="location.href='/'">← Back to Home</button>
        </div>
    </nav>

    <main class="main-layout" style="display: flex; justify-content: center; align-items: center;">
        <div class="panel" style="padding: 40px; background-color: var(--bg-main); border: none;">
            <table id="ChessTable">
                <tr> <th class="axis">8</th> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr>
                <tr> <th class="axis">7</th> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr>
                <tr> <th class="axis">6</th> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr>
                <tr> <th class="axis">5</th> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr>
                <tr> <th class="axis">4</th> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr>
                <tr> <th class="axis">3</th> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr>
                <tr> <th class="axis">2</th> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr>
                <tr> <th class="axis">1</th> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> <td></td> </tr>
                <tr>
                    <th class="axis"></th> 
                    <th class="axis">a</th> 
                    <th class="axis">b</th> 
                    <th class="axis">c</th> 
                    <th class="axis">d</th> 
                    <th class="axis">e</th> 
                    <th class="axis">f</th> 
                    <th class="axis">g</th> 
                    <th class="axis">h</th>
                </tr>
            </table>
        </div>
    </main>

    <button class="chat-toggle" id="chatToggleBtn" onclick="toggleChat()" title="Open Chat">💬</button>

    <div class="chat-panel hidden" id="chatPanel">
        <div class="chat-header">
            <span>Game Chat</span>
            <div style="display:flex; align-items:center; gap:10px;">
                <span class="chat-status">Opponent connected</span>
                <button onclick="toggleChat()" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer; padding:0;">✕</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Type a message..." maxlength="200"/>
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const currentUsername = "{{ current_user.username }}";
    </script>
    <script src="{{ url_for('static', filename='js/chatbox.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat-toggle.js') }}"></script>

</body>
</html>
